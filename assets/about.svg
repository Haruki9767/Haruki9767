<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" role="img" aria-labelledby="title desc">
  <title id="title">About Haruki</title>
  <desc id="desc">Decorative violet panel labeled about Haruki and Lime, with an animated orbit and soft neon accents.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0B1E" />
      <stop offset="0.55" stop-color="#171329" />
      <stop offset="1" stop-color="#291746" />
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.25" />
      <stop offset="0.5" stop-color="#F3A6D8" />
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.25" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0.55" />
      <stop offset="1" stop-color="#C084FC" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect x="12" y="12" width="1256" height="206" rx="24" fill="url(#panel)" stroke="url(#stroke)" stroke-width="2" />
  <circle cx="1060" cy="115" r="150" fill="url(#halo)" opacity="0.7">
    <animate attributeName="r" values="130;170;130" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.45;0.8;0.45" dur="7s" repeatCount="indefinite" />
  </circle>
  <g transform="translate(1060 115)">
    <ellipse rx="78" ry="32" fill="none" stroke="#A78BFA" stroke-opacity="0.38" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </ellipse>
    <ellipse rx="78" ry="32" fill="none" stroke="#F3A6D8" stroke-opacity="0.34" stroke-width="2" transform="rotate(60)">
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="13s" repeatCount="indefinite" />
    </ellipse>
    <circle r="16" fill="#C084FC">
      <animate attributeName="r" values="13;19;13" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="78" cy="0" r="5" fill="#F3A6D8" />
  </g>
  <g transform="translate(78 62)">
    <text x="0" y="0" fill="#C084FC" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="3">01  /  IDENTITY</text>
    <text x="0" y="55" fill="#F8FAFC" font-size="46" font-weight="700" font-family="Arial, Helvetica, sans-serif">ABOUT HARUKI</text>
    <text x="0" y="92" fill="#CBD5E1" font-size="20" font-family="Arial, Helvetica, sans-serif">also known as Lime</text>
    <path d="M0 121 H510" stroke="url(#stroke)" stroke-width="2" />
    <text x="0" y="153" fill="#94A3B8" font-size="15" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.4">LOW-LEVEL CURIOSITY  /  CREATIVE BUILDS  /  CONSTANT LEARNING</text>
  </g>
</svg>
