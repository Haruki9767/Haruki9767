<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 170" role="img" aria-labelledby="title desc">
  <title id="title">GitHub signals</title>
  <desc id="desc">Decorative analytics panel labeled GitHub signals with a slowly animating activity line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0B1E" />
      <stop offset="1" stop-color="#24143F" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" />
      <stop offset="0.5" stop-color="#F3A6D8" />
      <stop offset="1" stop-color="#C084FC" />
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="1256" height="146" rx="22" fill="url(#bg)" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="2" />
  <text x="66" y="62" fill="#C084FC" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="3">03  /  ANALYTICS</text>
  <text x="66" y="105" fill="#F8FAFC" font-size="36" font-weight="700" font-family="Arial, Helvetica, sans-serif">GITHUB SIGNALS</text>
  <text x="66" y="133" fill="#94A3B8" font-size="15" font-family="Arial, Helvetica, sans-serif">activity, languages, and little proof of motion</text>
  <path d="M720 118 C780 75 820 136 874 96 S972 75 1020 108 1098 70 1162 94 1210 65 1250 82" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" values="0;-110" dur="4s" repeatCount="indefinite" />
  </path>
  <circle cx="1162" cy="94" r="5" fill="#F3A6D8">
    <animate attributeName="r" values="4;8;4" dur="2.6s" repeatCount="indefinite" />
  </circle>
</svg>
