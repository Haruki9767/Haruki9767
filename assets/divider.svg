<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 32" role="img" aria-label="Animated lavender divider">
  <defs>
    <linearGradient id="dividerGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0" />
      <stop offset="0.28" stop-color="#A78BFA" stop-opacity="0.35" />
      <stop offset="0.5" stop-color="#F3A6D8" />
      <stop offset="0.72" stop-color="#A78BFA" stop-opacity="0.35" />
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0" />
    </linearGradient>
  </defs>
  <path d="M0 16 H1280" stroke="url(#dividerGradient)" stroke-width="2" />
  <circle cx="640" cy="16" r="3" fill="#F3A6D8">
    <animate attributeName="r" values="2;5;2" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="640" cy="16" r="8" fill="none" stroke="#C084FC" stroke-opacity="0.24">
    <animate attributeName="r" values="5;15;5" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.65;0;0.65" dur="2.4s" repeatCount="indefinite" />
  </circle>
</svg>
